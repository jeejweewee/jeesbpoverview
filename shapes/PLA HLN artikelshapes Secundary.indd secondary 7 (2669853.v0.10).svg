<svg xmlns="http://www.w3.org/2000/svg" width="487.874" height="376.6" viewBox="2.6769999999999996 50.001999999999995 487.874 376.6">
<style>
    .page { fill: #fff; stroke: #ccc; }
    .margin { fill: none; stroke: #aaa; stroke-dasharray: 4 2; }
    .column { fill: none; stroke: #ddd; }
    .grid { stroke: #eee; stroke-width: 0.5; }

    .text-frame { fill: rgba(0,0,255,0.08); stroke: #00f; }
    .image-frame { fill: rgba(255,165,0,0.15); stroke: #f90; }
    .decor-frame { fill: rgba(0, 180, 100, 0.12); stroke: #00a060; stroke-width: 1; stroke-dasharray: 5 3; }

    .frame-id { 
        font-size: 7px; 
        fill: #666;
    }
    
    .thread {
        fill: none;
        stroke: #888;
        stroke-dasharray: 3 3;
        stroke-width: 1;
    }

    .label {
        font-size: 9px;
        font-family: monospace;
    }

    .snippet {
        font-size: 12px;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        fill: #111;
    }

    .label-bg {
        fill: #000;
        opacity: 0.75;
    }

    .label-inv {
        fill: #fff;
        text-anchor: end;
    }

    .z-index { 
        font-size: 7px; 
        fill: #333;
        text-anchor: end;
        paint-order: stroke fill;
        stroke: white;
        stroke-width: 2;
        stroke-linejoin: round;
    }

    .distance {
        stroke: red;
        stroke-width: 2.5;
        fill: none;
    }

    .edge-ghost {
        stroke: rgba(200, 0, 0, 0.4);
        stroke-width: 1.5;
        stroke-dasharray: 6 3;
        fill: none;
    }

    .arrowhead {
        fill: red;
    }
    
    .fender-zone {
        fill: url(#fender-hatch);
        stroke: none;
    }

    .fender-edge {
        stroke: #0891b2;
        stroke-width: 2;
        fill: none;
    }
</style>
<defs>
    <pattern id="baseline-grid" patternUnits="userSpaceOnUse" width="100%" height="10.2">
        <line x1="0" y1="0" x2="100%" y2="0" class="grid" />
    </pattern>
    <pattern id="checkerboard" patternUnits="userSpaceOnUse" width="20" height="20">
        <rect width="20" height="20" fill="#e8e8e8" stroke="none"/>
        <rect width="10" height="10" fill="#ffffff" stroke="none"/>
        <rect x="10" y="10" width="10" height="10" fill="#ffffff" stroke="none"/>
    </pattern>
    <pattern id="fender-hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="8" stroke="#0891b2" stroke-width="1.2" stroke-opacity="0.5" />
    </pattern>
</defs>


<g id="article">

<rect class="image-frame" x="22.677" y="80.202" width="447.874" height="224.4" />
<rect class="label-bg" x="432.55100000000004" y="290.602" width="38" height="14" />
<text class="z-index" x="428.55100000000004" y="300.602" text-anchor="end">z:72</text>
<text class="label label-inv" x="466.55100000000004" y="300.602">image</text>
<rect class="text-frame" x="72.56700000000001" y="314.995" width="397.984" height="10.021" />
<rect class="label-bg" x="444.551" y="311.016" width="26" height="14" />
<text class="z-index" x="440.551" y="321.016" text-anchor="end">z:73</text>
<text class="label label-inv" x="466.551" y="321.016">KOP</text>
<rect class="text-frame" x="22.677" y="335.202" width="447.874" height="71.4" />
<rect class="label-bg" x="432.55100000000004" y="392.602" width="38" height="14" />
<text class="z-index" x="428.55100000000004" y="402.602" text-anchor="end">z:74</text>
<text class="label label-inv" x="466.55100000000004" y="402.602">TEKST</text>
<rect class="text-frame" x="22.677" y="314.414" width="43.148" height="13.408" />
<rect class="label-bg" x="21.825000000000003" y="313.822" width="44" height="14" />
<text class="z-index" x="17.825000000000003" y="323.822" text-anchor="end">z:75</text>
<text class="label label-inv" x="61.825" y="323.822">PLAATS</text>
</g>
</svg>
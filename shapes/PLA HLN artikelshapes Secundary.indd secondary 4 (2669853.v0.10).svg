<rect class="label-bg" x="585.622" y="953.601" width="38" height="14" />
<text class="z-index" x="581.622" y="963.601" text-anchor="end">z:38</text>
<text class="label label-inv" x="619.622" y="963.601">INTRO</text>
</g>
</svg>
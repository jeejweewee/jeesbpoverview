<rect class="text-frame" x="481.89" y="834.987" width="294.803" height="51.23" />
<rect class="label-bg" x="750.693" y="872.217" width="26" height="14" />
<text class="z-index" x="746.693" y="882.217" text-anchor="end">z:34</text>
<text class="label label-inv" x="772.693" y="882.217">KOP</text>

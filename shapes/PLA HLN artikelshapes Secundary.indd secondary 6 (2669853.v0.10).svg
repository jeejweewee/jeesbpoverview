<svg xmlns="http://www.w3.org/2000/svg" width="794.016" height="376.793" viewBox="-796.693 50.001999999999995 794.016 376.793">
<style>
    .page { fill: #fff; stroke: #ccc; }
    .margin { fill: none; stroke: #aaa; stroke-dasharray: 4 2; }
    .column { fill: none; stroke: #ddd; }
    .grid { stroke: #eee; stroke-width: 0.5; }

    .text-frame { fill: rgba(0,0,255,0.08); stroke: #00f; }
    .image-frame { fill: rgba(255,165,0,0.15); stroke: #f90; }
    .decor-frame { fill: rgba(0, 180, 100, 0.12); stroke: #00a060; stroke-width: 1; stroke-dasharray: 5 3; }

    .frame-id { 
        font-size: 7px; 
        fill: #666;
    }
    
    .thread {
        fill: none;
        stroke: #888;
        stroke-dasharray: 3 3;
        stroke-width: 1;
    }

    .label {
        font-size: 9px;
        font-family: monospace;
    }

    .snippet {
        font-size: 12px;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        fill: #111;
    }

    .label-bg {
        fill: #000;
        opacity: 0.75;
    }

    .label-inv {
        fill: #fff;
        text-anchor: end;
    }

    .z-index { 
        font-size: 7px; 
        fill: #333;
        text-anchor: end;
        paint-order: stroke fill;
        stroke: white;
        stroke-width: 2;
        stroke-linejoin: round;
    }

    .distance {
        stroke: red;
        stroke-width: 2.5;
        fill: none;
    }

    .edge-ghost {
        stroke: rgba(200, 0, 0, 0.4);
        stroke-width: 1.5;
        stroke-dasharray: 6 3;
        fill: none;
    }

    .arrowhead {
        fill: red;
    }
    
    .fender-zone {
        fill: url(#fender-hatch);
        stroke: none;
    }

    .fender-edge {
        stroke: #0891b2;
        stroke-width: 2;
        fill: none;
    }
</style>
<defs>
    <pattern id="baseline-grid" patternUnits="userSpaceOnUse" width="100%" height="10.2">
        <line x1="0" y1="0" x2="100%" y2="0" class="grid" />
    </pattern>
    <pattern id="checkerboard" patternUnits="userSpaceOnUse" width="20" height="20">
        <rect width="20" height="20" fill="#e8e8e8" stroke="none"/>
        <rect width="10" height="10" fill="#ffffff" stroke="none"/>
        <rect x="10" y="10" width="10" height="10" fill="#ffffff" stroke="none"/>
    </pattern>
    <pattern id="fender-hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="8" stroke="#0891b2" stroke-width="1.2" stroke-opacity="0.5" />
    </pattern>
</defs>


<g id="article">

<rect class="image-frame" x="-643.5509999999999" y="79.098" width="620.874" height="326.594" />
<rect class="label-bg" x="-60.67699999999991" y="391.692" width="38" height="14" />
<text class="z-index" x="-64.67699999999991" y="401.692" text-anchor="end">z:89</text>
<text class="label label-inv" x="-26.676999999999907" y="401.692">image</text>
<rect class="text-frame" x="-776.693" y="95.443" width="119.055" height="40.8" />
<rect class="label-bg" x="-683.6379999999999" y="122.243" width="26" height="14" />
<text class="z-index" x="-687.6379999999999" y="132.243" text-anchor="end">z:90</text>
<text class="label label-inv" x="-661.6379999999999" y="132.243">KOP</text>
<rect class="text-frame" x="-776.693" y="77.69399999999999" width="43.148" height="13.408" />
<rect class="label-bg" x="-777.545" y="77.10199999999999" width="44" height="14" />
<text class="z-index" x="-781.545" y="87.10199999999999" text-anchor="end">z:91</text>
<text class="label label-inv" x="-737.545" y="87.10199999999999">PLAATS</text>
<rect class="text-frame" x="-776.693" y="141.402" width="119.055" height="265.394" />
<rect class="label-bg" x="-695.6379999999999" y="392.796" width="38" height="14" />
<text class="z-index" x="-699.6379999999999" y="402.796" text-anchor="end">z:92</text>
<text class="label label-inv" x="-661.6379999999999" y="402.796">TEKST</text>
</g>
</svg>